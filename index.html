<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>論文モジュール</title>
<style>
  :root{
    --bg:#0b0f18;
    --panel:#161c2b;
    --panel2:#1c2337;
    --text:#eef1f8;
    --sub:#9aa4bd;
    --line:#2a3247;
    --c-common:#5b8cff;
    --c-t1:#f2b84b;
    --c-t2:#7ee0c3;
    --c-t3:#e08fe0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky;top:0;z-index:10;
    background:rgba(11,15,24,.92);backdrop-filter:blur(10px);
    padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;
    border-bottom:1px solid var(--line);
  }
  header h1{font-size:17px;margin:0 0 10px;font-weight:700;}
  .search{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14px;
  }
  .search::placeholder{color:var(--sub);}
  .tabs{
    display:flex;gap:6px;overflow-x:auto;padding:10px 14px 12px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:var(--panel);border:1px solid var(--line);color:var(--sub);white-space:nowrap;
  }
  .tab.active{background:var(--c-common);color:#0b0f18;border-color:var(--c-common);}

  main{padding:12px 14px 40px;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;
    border-left:4px solid var(--c-common);
  }
  .card.t1{border-left-color:var(--c-t1);}
  .card.t2{border-left-color:var(--c-t2);}
  .card.t3{border-left-color:var(--c-t3);}
  .card-head{
    display:flex;align-items:center;justify-content:space-between;padding:13px 14px;gap:10px;
  }
  .card-head .titlebox{flex:1;min-width:0;}
  .card-head .tag{
    display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
    background:rgba(91,140,255,.15);color:var(--c-common);margin-bottom:4px;
  }
  .card.t1 .card-head .tag{background:rgba(242,184,75,.15);color:var(--c-t1);}
  .card.t2 .card-head .tag{background:rgba(126,224,195,.15);color:var(--c-t2);}
  .card.t3 .card-head .tag{background:rgba(224,143,224,.15);color:var(--c-t3);}
  .card-head .keyword{font-size:14.5px;font-weight:700;line-height:1.4;}
  .chev{font-size:18px;color:var(--sub);transition:transform .2s;flex:0 0 auto;}
  .card.open .chev{transform:rotate(180deg);}
  .card-body{
    max-height:0;overflow:hidden;transition:max-height .25s ease;
  }
  .card.open .card-body{max-height:300px;}
  .card-body .inner{padding:0 14px 14px;font-size:13.5px;color:var(--sub);line-height:1.7;}

  .section-label{
    font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.05em;text-transform:uppercase;
    margin:20px 2px 8px;
  }
  .section-label:first-child{margin-top:4px;}

  .combo{
    background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:8px;
  }
  .combo h3{font-size:14px;margin:0 0 8px;}
  .combo ol{margin:0;padding-left:18px;font-size:13px;color:var(--text);line-height:1.85;}
  .combo .note{color:var(--sub);font-size:12px;margin-top:10px;line-height:1.6;}

  .hint{
    text-align:center;color:var(--sub);font-size:11px;padding:8px 20px 0;line-height:1.6;
  }
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 20px;}

  #gate{
    position:fixed;inset:0;z-index:999;background:var(--bg);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;
  }
  #gate.hidden{display:none;}
  #gate .box{width:100%;max-width:320px;text-align:center;}
  #gate h2{font-size:16px;margin:0 0 16px;}
  #gate input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:15px;text-align:center;
  }
  #gate button{
    width:100%;margin-top:10px;padding:12px;border-radius:10px;border:none;
    background:var(--c-common);color:#0b0f18;font-weight:700;font-size:14px;
  }
  #gate .err{color:#ff8080;font-size:12px;margin-top:8px;min-height:1em;}
  #content{display:none;}
  #content.visible{display:block;}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>🔒 パスワードを入力してください</h2>
    <input type="password" id="pw" placeholder="パスワード" autofocus>

  <div class="tabs" id="tabs"></div>
</header>

<main id="main"></main>

const CATS = ["すべて", ...Array.from(new Set(DATA.map(d=>d.cat)))];
const TOPICS = ["すべて", ...Array.from(new Set(DATA.map(d=>d.topic)))];
let activeCat = "すべて";
let activeTopic = "すべて";

function renderTopicTabs(){
  const topicTabs = document.getElementById("topicTabs");
  topicTabs.innerHTML = TOPICS.map(t =>
    `<div class="tab ${t===activeTopic?'active':''}" onclick="setTopic('${t}')">${t}</div>`
  ).join("");
}

function setTopic(t){ activeTopic = t; activeCat = "すべて"; render(); }

function renderTabs(){
  const scoped = activeTopic === "すべて" ? DATA : DATA.filter(d => d.topic === activeTopic);
  const cats = ["すべて", ...Array.from(new Set(scoped.map(d=>d.cat)))];
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = cats.map(c =>
    `<div class="tab ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</div>`
  ).join("") + `<div class="tab ${activeCat==='組み立て手順'?'active':''}" onclick="setCat('組み立て手順')">組み立て手順</div>`;
}

function setCat(c){ activeCat = c; render(); }

function render(){
  renderTopicTabs();
  renderTabs();
  const main = document.getElementById("main");
  const q = document.getElementById("search").value.trim().toLowerCase();

  if(activeCat === "組み立て手順"){
    main.innerHTML = `
      <div class="combo">
        <h3>本番での組み立て手順</h3>
        <ol>
          <li>出題テーマを見て、「課題認識」「IT戦略の結び」のどのブロックを使うか決める</li>
          <li>設問アは「事業特性・経営戦略 → 課題認識 → IT戦略の結び」の順で組む</li>
          <li>設問イは「課題認識の続き → 提案内容 → 工夫した点」の順で組む</li>
          <li>設問ウは「実施内容 → 評価 → 今後の課題」の順で組む</li>
          <li>各ブロックの文言は丸暗記せず、出題文の言葉遣いに合わせて言い換える</li>
        </ol>
        <p class="note">ブロック同士の「橋渡しの一文」（前のブロックを受けて、次のブロックにつなげる一文）を忘れないこと。これが論文の一貫性を作る一番のポイント。</p>
      </div>`;
    return;
  }

  let items = activeTopic === "すべて" ? DATA : DATA.filter(d => d.topic === activeTopic);
  if(activeCat !== "すべて") items = items.filter(d => d.cat === activeCat);
  if(q) items = items.filter(d => (d.kw+d.body+d.cat).toLowerCase().includes(q));

  if(items.length === 0){
    main.innerHTML = `<div class="empty">該当するモジュールが見つかりません</div>`;
    return;
  }

  let html = "";
  let lastCat = null;
  items.forEach((d, i) => {
    if(activeCat === "すべて" && d.cat !== lastCat){
      html += `<div class="section-label">${d.cat}</div>`;
      lastCat = d.cat;
    }
    html += `
      <div class="card ${d.tclass}" id="card-${i}">
        <div class="card-head" onclick="toggle(${i})">
          <div class="titlebox">
            <span class="tag">${d.tag}</span>
            <div class="keyword">${d.kw}</div>
          </div>
          <div class="chev">⌄</div>
        </div>
        <div class="card-body"><div class="inner">${d.body}</div></div>
      </div>`;
  });
  main.innerHTML = html;
  window.__items = items;
}

function toggle(i){
  document.getElementById("card-"+i).classList.toggle("open");
}

const PW_HASH = "d7258571fe628d609005ee5313ba9bc9061c6fb74c69a118bff0ed71978d62f1";
const PW_STORE_KEY = "it-strategist-modules-unlocked";

async function sha256Hex(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function unlockUI(){
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("content").classList.add("visible");
  render();
}

async function tryUnlock(){
  const val = document.getElementById("pw").value;
  const hash = await sha256Hex(val);
  if(hash === PW_HASH){
    localStorage.setItem(PW_STORE_KEY, "1");
    unlockUI();
  } else {
    document.getElementById("pwErr").textContent = "パスワードが違います";
  }
}

document.getElementById("pw").addEventListener("keydown", (e) => {
  if(e.key === "Enter") tryUnlock();
});

if(localStorage.getItem(PW_STORE_KEY) === "1"){
  unlockUI();
}
</script>
